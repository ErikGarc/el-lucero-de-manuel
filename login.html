
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Acceso del personal | El Lucero de Manuel</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <main class="pagina-login">

        <section class="tarjeta-login">

            <img
                src="assets/imagenes/logo.png"
                alt="El Lucero de Manuel"
                class="logo-login"
            >

            <h1>Acceso del personal</h1>

            <p>
                El Lucero de Manuel
            </p>

            <form id="formulario-login">

                <label for="correo-login">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo-login"
                    placeholder="Correo del personal"
                    autocomplete="username"
                    required
                >

                <label for="password-login">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password-login"
                    placeholder="Contraseña"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">
                    Iniciar sesión
                </button>

            </form>

            <p class="mensaje-login" id="mensaje-login">
            </p>

            <a href="index.html" class="volver-menu">
                ← Volver al menú
            </a>

        </section>

    </main>

<script type="module" src="js/login.js"></script>

</body>
</html>
